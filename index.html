<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%234a6cf7'/%3E%3Ccircle cx='8' cy='9' r='2' fill='%2325c2a0'/%3E%3Ccircle cx='24' cy='9' r='2' fill='%23e05a47'/%3E%3Ccircle cx='8' cy='24' r='2' fill='%23e0a83a'/%3E%3Ccircle cx='24' cy='24' r='2' fill='%238b95a8'/%3E%3C/svg%3E"
    />
    <title>知枢矩阵 · 3D 知识空间</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="btn-home" type="button" aria-label="返回大厅">大厅</button>
        <div id="where" aria-live="polite">中央大厅</div>
        <input id="search" type="search" placeholder="搜索（批 4 接入）" aria-label="搜索" disabled />
      </header>

      <main id="stage">
        <div id="three-root" hidden></div>
        <div id="svg-root" hidden></div>
        <div id="loading">正在载入索引…</div>
      </main>

      <nav id="roombar" aria-label="学科分区"></nav>

      <div id="minimap" hidden aria-hidden="true">
        <canvas id="minimap-canvas" width="216" height="150"></canvas>
        <span id="minimap-cap">俯视 · 中央大厅</span>
      </div>

      <aside id="panel" hidden aria-label="详情">
        <header>
          <button id="panel-back" type="button" aria-label="返回上一级" disabled>←</button>
          <button id="panel-close" type="button" aria-label="关闭阅读层">×</button>
          <h2 id="panel-title"></h2>
        </header>
        <div id="panel-crumb" aria-live="polite"></div>
        <div id="panel-body"></div>
      </aside>

      <footer id="hud"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
